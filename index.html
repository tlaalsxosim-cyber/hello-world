<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    text-align: center;
    padding: 3rem 4rem;
    border-radius: 16px;
    background: #1e293b;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }
  h1 {
    margin: 0;
    font-size: 2.5rem;
    color: #f8fafc;
  }
  p {
    margin-top: 0.75rem;
    color: #94a3b8;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <h1>Hello, World2!</h1>
    <p id="time"></p>
  </div>
  <script>
    document.getElementById('time').textContent = new Date().toLocaleString('ko-KR');
  </script>
</body>
</html>
